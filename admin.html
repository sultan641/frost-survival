
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frost Survival Admin</title>
  <link rel="stylesheet" href="style.css?v=20261101-audit1">
<style>
    #adminBox[hidden], #loginBox[hidden] { display:none !important; }
    body.admin-active { background:#eef4fa !important; color:#17324d !important; }
    body.admin-active:before { display:none !important; }
    body.admin-active main.wrap { max-width:1120px; }
    body.admin-active .hero { display:none !important; }
    body.admin-active .form-card { max-width:1120px; background:#fff !important; color:#17324d !important; border:1px solid #c7d8e8 !important; box-shadow:0 8px 28px #17324d12 !important; }
    body.admin-active #adminBox, body.admin-active #adminContent { color:#17324d !important; }
    body.admin-active #adminContent * { color:#17324d; }
    body.admin-active #adminContent button, body.admin-active #adminContent .btn { color:#fff !important; }
    body.admin-active #adminContent .secondary { color:#0757a2 !important; background:#e8f3ff !important; }
    body.admin-active #adminContent h1, body.admin-active #adminContent h2, body.admin-active #adminContent h3, body.admin-active #adminContent h4,
    body.admin-active #adminContent p, body.admin-active #adminContent label, body.admin-active #adminContent small,
    body.admin-active #adminContent .hint, body.admin-active #adminContent .small { color:#17324d !important; }
    body.admin-active #adminContent .fs-admin-hero,
    body.admin-active #adminContent .agent-vault-heading,
    body.admin-active #adminContent .agent-game-banner { color:#fff !important; }
    body.admin-active #adminContent .fs-admin-hero *,
    body.admin-active #adminContent .agent-vault-heading *,
    body.admin-active #adminContent .agent-game-banner * { color:#fff !important; }
    body.admin-active #adminContent .admin-section,
    body.admin-active #adminContent .admin-record,
    body.admin-active #adminContent .agent-detail-card { background:#f7fbff !important; color:#17324d !important; border-color:#c8d9e8 !important; }
    body.admin-active #adminContent input:not([type=checkbox]), body.admin-active #adminContent textarea,
    body.admin-active #adminContent select { background:#fff !important; color:#172f48 !important; border:1px solid #9fb5ca !important; }
    body.admin-active #adminContent input[type=checkbox] { accent-color:#087bdb; }
    body.admin-active #adminStatus { color:#0757a2 !important; }
    body.admin-active footer { display:none !important; }
    /* Strong, consistent contrast for every admin tool and sub-page. */
    body.admin-active #adminContent,
    body.admin-active #adminContent p,
    body.admin-active #adminContent span,
    body.admin-active #adminContent strong,
    body.admin-active #adminContent b,
    body.admin-active #adminContent small,
    body.admin-active #adminContent label,
    body.admin-active #adminContent h1,
    body.admin-active #adminContent h2,
    body.admin-active #adminContent h3,
    body.admin-active #adminContent h4,
    body.admin-active #adminContent li,
    body.admin-active #adminContent a { color:#17324d !important; text-shadow:none !important; }
    body.admin-active #adminContent button { color:#fff !important; }
    body.admin-active #adminContent button.secondary,
    body.admin-active #adminContent .secondary { color:#0757a2 !important; background:#e6f2ff !important; border-color:#b8d4ee !important; }
    body.admin-active #adminContent input,
    body.admin-active #adminContent textarea,
    body.admin-active #adminContent select { color:#17324d !important; background:#fff !important; border:1px solid #9db5cc !important; }
    body.admin-active #adminContent .admin-section,
    body.admin-active #adminContent .admin-record,
    body.admin-active #adminContent .agent-detail-card,
    body.admin-active #adminContent .fs-dashboard-section,
    body.admin-active #adminContent .fs-tool-card,
    body.admin-active #adminContent .fs-game-card,
    body.admin-active #adminContent .card,
    body.admin-active #adminContent section:not(.fs-admin-hero):not(.agent-vault-heading):not(.agent-game-banner) { background:#fff !important; color:#17324d !important; border-color:#c8d9e8 !important; }
    body.admin-active #adminContent .fs-admin-hero,
    body.admin-active #adminContent .agent-vault-heading,
    body.admin-active #adminContent .agent-game-banner,
    body.admin-active #adminContent .fs-discord { background:linear-gradient(110deg,#063b78,#087bd8) !important; }
    body.admin-active #adminContent .fs-admin-hero *,
    body.admin-active #adminContent .agent-vault-heading *,
    body.admin-active #adminContent .agent-game-banner *,
    body.admin-active #adminContent .fs-discord * { color:#fff !important; }
    body.admin-active #adminBackButton { display:inline-flex !important; visibility:visible !important; opacity:1 !important; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2.119.0';this.onerror=function(){window.frostSupabaseLoadFailed=true;var s=document.getElementById('adminStatus');if(s)s.textContent='Supabase login library failed to load from both CDNs. Switch network or browser and reload.';};"></script>
  <script>window.frostAdminJsReady=false;window.frostAdminSubmitGuard=function(e){if(!window.frostAdminJsReady){e.preventDefault();var s=document.getElementById('adminStatus');if(s){s.hidden=false;s.style.display='block';s.textContent='Admin login script did not start. Reload the page; if it repeats, switch network or browser.';}return false;}return true;};</script>
</head>
<body>
  <header class="top">
    <div class="wrap nav">
      <a class="brand" href="index.html">
        <span class="logo">❄</span>
        <span>FROST <i>SURVIVAL</i><small>ADMIN CONSOLE</small></span>
      </a>
      <nav><a href="index.html">Public Site</a></nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">RESTRICTED MANAGEMENT AREA</div>
      <h1>Admin<br><em>Console.</em></h1>
      <p class="lead">Sign in with your Supabase admin account.</p>
    </section>

    <section class="form-card">
      <div id="loginBox">
        <h2>Admin Sign In</h2>
        <form id="loginForm" onsubmit="return window.frostAdminSubmitGuard(event)">
          <div class="field">
            <label for="email">Email</label>
            <input class="input" type="email" id="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" type="password" id="password" required>
          </div>
          <button type="submit" >Sign In</button>
        </form>
      </div>

      <div id="adminBox" hidden>
        <div class="actions">
          <button type="button" class="secondary" id="adminBackButton">← Back</button><button type="button" class="secondary" id="signOutButton">Sign Out</button>
        </div>
        <div id="adminContent"></div>
      </div>

      <p class="status" id="adminStatus" aria-live="polite">Loading secure admin sign-in…</p>
    </section>
  </main>

  

  <script src="admin.js?v=20261120-admin-fix-v10" onerror="var s=document.getElementById('adminStatus');if(s){s.hidden=false;s.style.display='block';s.textContent='Admin JavaScript file failed to load. Refresh the page and try again.';}"></script><script src="analytics.js?v=7"></script>

</body>
</html>
