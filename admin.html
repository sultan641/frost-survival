
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frost Survival Admin</title>
  <link rel="stylesheet" href="style.css?v=20261101-audit1">
  <style>#adminBox[hidden], #loginBox[hidden] { display: none !important; }</style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0" onerror="this.onerror=null;this.src='https://unpkg.com/@supabase/supabase-js@2.119.0';this.onerror=function(){window.frostSupabaseLoadFailed=true;var s=document.getElementById('adminStatus');if(s)s.textContent='Supabase login library failed to load from both CDNs. Switch network or browser and reload.';};"></script>
  <script>window.frostAdminJsReady=false;window.frostAdminSubmitGuard=function(e){if(!window.frostAdminJsReady){e.preventDefault();var s=document.getElementById('adminStatus');if(s){s.hidden=false;s.style.display='block';s.textContent='Admin login script did not start. Reload the page; if it repeats, switch network or browser.';}return false;}return true;};</script>
</head>
<body>
  <header class="top">
    <div class="wrap nav">
      <a class="brand" href="index.html">
        <span class="logo">❄</span>
        <span>FROST <i>SURVIVAL</i><small>ADMIN CONSOLE</small></span>
      </a>
      <nav><a href="index.html">Public Site</a></nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">RESTRICTED MANAGEMENT AREA</div>
      <h1>Admin<br><em>Console.</em></h1>
      <p class="lead">Sign in with your Supabase admin account.</p>
    </section>

    <section class="form-card">
      <div id="loginBox">
        <h2>Admin Sign In</h2>
        <form id="loginForm" onsubmit="return window.frostAdminSubmitGuard(event)">
          <div class="field">
            <label for="email">Email</label>
            <input class="input" type="email" id="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" type="password" id="password" required>
          </div>
          <button type="submit" >Sign In</button>
        </form>
      </div>

      <div id="adminBox" hidden>
        <div class="actions">
          <a class="btn" href="discord-control/" style="display:inline-block;text-decoration:none;padding:10px 14px">❄ Discord Control Panel</a>
          <button type="button" onclick="showTab('analytics')">Promotion Analytics</button><a class="btn secondary" href="growth-center.html">📈 Frost Growth Center</a>
          <button type="button" class="secondary" id="signOutButton">Sign Out</button>
        </div>
        <div id="adminContent"></div>
      </div>

      <p class="status" id="adminStatus" aria-live="polite">Loading secure admin sign-in…</p>
    </section>
  </main>

  <footer>
    <div class="wrap"><a href="index.html">Back to site</a></div>
  </footer>

  <script src="admin.js?v=20261112-youtube-progress-all-v4" onerror="var s=document.getElementById('adminStatus');if(s){s.hidden=false;s.style.display='block';s.textContent='Admin JavaScript file failed to load. Refresh the page and try again.';}"></script><script src="analytics.js?v=7"></script>
<script src="back-navigation.js?v=2"></script>
</body>
</html>
