
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frost Survival Admin</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="top">
    <div class="wrap nav">
      <a class="brand" href="index.html">
        <span class="logo">❄</span>
        <span>FROST <i>SURVIVAL</i><small>ADMIN CONSOLE</small></span>
      </a>
      <nav><a href="index.html">Public Site</a></nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="eyebrow">RESTRICTED MANAGEMENT AREA</div>
      <h1>Admin<br><em>Console.</em></h1>
      <p class="lead">Sign in with your Supabase admin account.</p>
    </section>

    <section class="form-card">
      <div id="loginBox">
        <h2>Admin Sign In</h2>
        <form id="loginForm">
          <div class="field">
            <label for="email">Email</label>
            <input class="input" type="email" id="email" required>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="input" type="password" id="password" required>
          </div>
          <button type="submit">Sign In</button>
        </form>
      </div>

      <div id="adminBox" hidden>
        <div class="actions">
          <button type="button" onclick="showTab('codes')">Gift Codes</button>
          <button type="button" onclick="showTab('announcements')">Announcements</button>
          <button type="button" onclick="showTab('apps')">Applications</button>
          <button type="button" onclick="showTab('bugs')">Bug Reports</button>
          <button type="button" class="secondary" onclick="signOut()">Sign Out</button>
        </div>
        <div id="adminContent"></div>
      </div>

      <p class="status" id="adminStatus" aria-live="polite"></p>
    </section>
  </main>

  <footer>
    <div class="wrap"><a href="index.html">Back to site</a></div>
  </footer>

  <script src="admin.js"></script>
</body>
</html>
