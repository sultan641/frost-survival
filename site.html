<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gaming Community</title><link rel="stylesheet" href="style.css"><style>.tenant{max-width:1000px;margin:35px auto;padding:18px}.tenant-card{padding:18px;margin:14px 0;border:1px solid #17619b;border-radius:14px;background:#071a30}.tenant a{color:#70caff}.tenant-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}</style></head><body><main class="tenant"><a href="index.html">❄ Frost Survival</a><h1 id="name">Loading website…</h1><p id="desc"></p><section><h2>Games & Downloads</h2><div id="games" class="tenant-grid"></div></section><section><h2>Gift Codes</h2><div id="codes" class="tenant-grid"></div></section><section><h2>Community Links</h2><div id="socials" class="tenant-grid"></div></section><section><h2>Announcements</h2><div id="news"></div></section><footer>Powered by Frost Survival · <a href="builder.html">Create your own website</a></footer></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://xnixsavppmmvbzfnybus.supabase.co","sb_publishable_tx2KV3IddBr70wmLIrsLzQ_1DSHcUdT");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const url=s=>{try{const u=new URL(s);return ["https:","http:"].includes(u.protocol)?u.href:"#"}catch{return "#"}};
(async()=>{const slug=new URLSearchParams(location.search).get("site");if(!slug){document.getElementById("name").textContent="Website not found";return}const {data,error}=await db.from("builder_sites").select("site_name,description,content,published").eq("slug",slug).eq("published",true).maybeSingle();if(error||!data){document.getElementById("name").textContent="Website unavailable";return}document.title=data.site_name;document.getElementById("name").textContent=data.site_name;document.getElementById("desc").textContent=data.description||"";const c=data.content||{};document.getElementById("games").innerHTML=(c.games||[]).map(g=>'<article class="tenant-card"><h3>'+esc(g.name)+'</h3><p>'+esc(g.description)+'</p>'+(g.promo?'<p>Promo code: <strong>'+esc(g.promo)+'</strong></p>':'')+'<a target="_blank" rel="noopener" href="'+esc(url(g.url))+'">Download / Visit ↗</a></article>').join("")||"<p>No games added yet.</p>";document.getElementById("codes").innerHTML=(c.gift_codes||[]).map(x=>'<article class="tenant-card"><b>'+esc(x.game)+'</b><p>Code: <strong>'+esc(x.code)+'</strong> <button data-copy="'+esc(x.code)+'">Copy</button></p><small>'+esc(x.expires)+'</small></article>').join("")||"<p>No gift codes yet.</p>";document.getElementById("socials").innerHTML=(c.socials||[]).map(x=>'<article class="tenant-card"><a target="_blank" rel="noopener" href="'+esc(url(x.url))+'">'+esc(x.label)+' ↗</a></article>').join("")||"<p>No social links.</p>";document.getElementById("news").innerHTML=(c.announcements||[]).map(x=>'<article class="tenant-card"><h3>'+esc(x.title)+'</h3><p>'+esc(x.message)+'</p></article>').join("")||"<p>No announcements.</p>";document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent="Copied!"}catch{b.textContent="Copy unavailable"}})})();
</script></body></html>
