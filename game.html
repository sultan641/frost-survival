<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Game Details</title><link rel="stylesheet" href="style.css"><style>
body{background:#06182c;color:#eaf5ff;font-family:Arial,sans-serif}.game-wrap{max-width:900px;margin:24px auto;padding:18px}.game-card{background:#0b2140;border:1px solid #28629b;border-radius:14px;padding:18px;margin:14px 0}.links{display:flex;gap:10px;flex-wrap:wrap}.links a,.game-btn{padding:10px 14px;border:1px solid #3c83c5;border-radius:9px;color:#8fd5ff;text-decoration:none;background:#102c50}.muted{color:#a9bfd5}
</style></head><body><main class="game-wrap"><div class="links"><a href="#" id="back">← Back to community website</a><a href="#" id="manageWebsite" hidden>⚙ Website Admin</a></div><h1 id="gameName">Loading game…</h1><button class="game-btn" id="shareGame" type="button">Share this game page ↗</button><p id="shareStatus" class="muted" aria-live="polite"></p><p id="gameDescription" class="muted"></p><article class="game-card"><h2>Download / Play</h2><p id="promo"></p><a id="download" class="game-btn" target="_blank" rel="noopener noreferrer">Download / Visit ↗</a></article><section><h2>Gift Codes</h2><div id="codes"></div></section><section><h2>Game Updates & Announcements</h2><div id="updates"></div></section><section><h2>Community Links</h2><div id="socials" class="links"></div></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=window.supabase.createClient("https://xnixsavppmmvbzfnybus.supabase.co","sb_publishable_tx2KV3IddBr70wmLIrsLzQ_1DSHcUdT");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=s=>{try{const u=new URL(s);return ["https:","http:"].includes(u.protocol)?u.href:"#"}catch{return "#"}};
(async()=>{const q=new URLSearchParams(location.search),slug=q.get("site"),index=Number(q.get("game"));document.getElementById("back").href="site.html?site="+encodeURIComponent(slug||"");document.getElementById("manageWebsite").href="builder.html?site="+encodeURIComponent(slug||"");document.getElementById("shareGame").onclick=async()=>{const shareUrl=location.href;try{if(navigator.share)await navigator.share({title:document.getElementById("gameName").textContent,text:"View this game page, updates, gift codes and download links",url:shareUrl});else{await navigator.clipboard.writeText(shareUrl);document.getElementById("shareStatus").textContent="Game page link copied."}}catch(e){if(e.name!=="AbortError")document.getElementById("shareStatus").textContent="Copy this link: "+shareUrl}};if(!slug||!Number.isInteger(index)||index<0){document.getElementById("gameName").textContent="Game not found";return}
const {data,error}=await db.from("builder_sites").select("owner_id,site_name,content,published").eq("slug",slug).eq("published",true).maybeSingle();if(error||!data){document.getElementById("gameName").textContent="Website unavailable";return}
const {data:{session}}=await db.auth.getSession();if(session?.user?.id===data.owner_id){const manage=document.getElementById("manageWebsite");manage.hidden=false;manage.href="builder.html?site="+encodeURIComponent(slug)}const c=data.content||{},g=(c.games||[])[index];if(!g){document.getElementById("gameName").textContent="Game not found";return}
document.title=g.name+" · "+data.site_name;document.getElementById("gameName").textContent=g.name;document.getElementById("gameDescription").textContent=g.description||"";document.getElementById("download").href=safe(g.url);if(g.promo)document.getElementById("promo").innerHTML="Promo code: <strong>"+esc(g.promo)+"</strong>";
const codes=(c.gift_codes||[]).filter(x=>(x.game||"").trim().toLowerCase()===g.name.trim().toLowerCase());document.getElementById("codes").innerHTML=codes.map(x=>'<article class="game-card"><b>'+esc(x.code)+'</b><p>'+esc(x.expires||"")+'</p><button class="game-btn" data-copy="'+esc(x.code)+'">Copy code</button></article>').join("")||'<p class="muted">No gift codes for this game yet.</p>';
const updates=(c.announcements||[]).filter(x=>!x.game||(x.game||"").trim().toLowerCase()===g.name.trim().toLowerCase());document.getElementById("updates").innerHTML=updates.map(x=>'<article class="game-card"><h3>'+esc(x.title)+'</h3><p>'+esc(x.message).replace(/\n/g,"<br>")+'</p></article>').join("")||'<p class="muted">No updates for this game yet.</p>';
document.getElementById("socials").innerHTML=(c.socials||[]).map(x=>'<a href="'+esc(safe(x.url))+'" target="_blank" rel="noopener">'+esc(x.label)+' ↗</a>').join("");
document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.copy);b.textContent="Copied!"}catch{b.textContent="Copy unavailable"}});
})();
</script><script src="back-navigation.js?v=1"></script>
</body></html>
